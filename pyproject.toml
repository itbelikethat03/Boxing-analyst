[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boxing-ai"
version = "0.1.0"
description = "Boxing event analytics: structured action events, sequence analysis, and (later) CV-based event extraction."
readme = "README.md"
requires-python = ">=3.11"
# Core stays deliberately tiny: pure-Python domain + analytics.
dependencies = [
    "pydantic>=2.6",
]

[project.scripts]
boxing-ai = "boxing_ai.cli:main"

[project.optional-dependencies]
db = ["psycopg[binary]>=3.1"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
# cv = [...]  # added in Phase 3 (torch, ultralytics, opencv); intentionally absent from the MVP.
dev = [
    "pytest>=8",
    "httpx2>=2.13",  # FastAPI/Starlette TestClient
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"boxing_ai.database" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a running PostgreSQL (configured via BOXING_AI_TEST_DSN); skipped otherwise",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# `ruff format` wraps code at line-length; long docstring/comment prose lines are allowed.
ignore = ["E501"]
